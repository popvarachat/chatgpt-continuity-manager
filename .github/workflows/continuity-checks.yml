name: continuity-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check chatgpt-conversation-handoff-exporter.user.js
          node --check continuity-storage-bridge.js
          node --check background.js
      - name: Continuity tests
        run: node tests/v130-continuity-static.test.cjs
      - name: Manifest parse
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
